<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9F7"/>
      <stop offset="70%" stop-color="#FCEAE6"/>
      <stop offset="100%" stop-color="#F3C0BC"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D99B"/>
      <stop offset="45%" stop-color="#D4A24B"/>
      <stop offset="75%" stop-color="#BA8128"/>
      <stop offset="100%" stop-color="#E5C275"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#BA8128" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#F3C0BC" stroke-width="6"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Inner Medallion -->
  <circle cx="256" cy="256" r="172" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="8" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="160" fill="#FFF5F3" stroke="#F3C0BC" stroke-width="2"/>

  <!-- Quran Calligraphic / Book Emblem -->
  <g transform="translate(146, 146) scale(0.86)">
    <!-- Book Spine & Pages -->
    <path d="M128 35 C80 15, 20 28, 5 45 C5 170, 5 190, 5 205 C25 188, 80 178, 128 198 C176 178, 231 188, 251 205 C251 190, 251 170, 251 45 C236 28, 176 15, 128 35 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M128 48 C85 30, 32 40, 18 55 C18 165, 18 180, 18 192 C35 178, 85 168, 128 186 C171 168, 221 178, 238 192 C238 180, 238 165, 238 55 C224 40, 171 30, 128 48 Z" fill="#FFFFFF"/>
    <!-- Decorative Center Spine line -->
    <line x1="128" y1="45" x2="128" y2="198" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Crescent & Star -->
    <path d="M128 75 A18 18 0 1 0 146 93 A15 15 0 1 1 128 75 Z" fill="url(#goldGrad)"/>
    <circle cx="132" cy="84" r="3" fill="#D4A24B"/>
  </g>
</svg>
